{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriFeed - Login</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <!-- BRAND -->
            <div class="brand">

                <div class="brand-icon">
                    🌾
                </div>

                <h1>AgriFeed</h1>

                <p>
                    Smart Livestock Feed Management
                </p>

            </div>


            <!-- LOGIN TITLE -->
            <div class="login-title">

                <h2>Welcome Back</h2>

                <p>
                    Login to your AgriFeed account
                </p>

            </div>


            <!-- ERROR MESSAGE -->
            {% if error %}

                <div class="login-error">
                    {{ error }}
                </div>

            {% endif %}


            <!-- LOGIN FORM -->
            <form method="POST">

                {% csrf_token %}


                <!-- USERNAME -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->
                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        <span>Remember me</span>

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <!-- REGISTER -->
            <div class="register-section">

                <span>
                    Don't have an account?
                </span>

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </div>


            <!-- FOOTER -->
            <div class="login-footer">

                <p>
                    © 2026 AgriFeed. All rights reserved.
                </p>

            </div>

        </div>

    </div>


    <!-- PASSWORD TOGGLE -->
    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".password-toggle");


            if (password.type === "password") {

                password.type = "text";

                button.textContent = "🙈";

            } else {

                password.type = "password";

                button.textContent = "👁";

            }

        }

    </script>

</body>

</html>
