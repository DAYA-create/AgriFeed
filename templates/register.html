{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgriFeed - Create Account</title>

    <link rel="stylesheet"
          href="{% static 'css/register.css' %}">

</head>


<body>

    <div class="register-page">

        <div class="register-card">


            <!-- =========================
                 BRAND
            ========================== -->

            <div class="brand">

                <div class="brand-icon">
                    🌾
                </div>

                <h1>
                    AgriFeed
                </h1>

                <p>
                    Smart Livestock Feed Management
                </p>

            </div>


            <!-- =========================
                 REGISTER TITLE
            ========================== -->

            <div class="register-title">

                <h2>
                    Create Your Account
                </h2>

                <p>
                    Join AgriFeed and manage your feed business smarter.
                </p>

            </div>


            <!-- =========================
                 ERROR MESSAGE
            ========================== -->

            {% if error %}

                <div class="register-error">
                    {{ error }}
                </div>

            {% endif %}


            <!-- =========================
                 REGISTRATION FORM
            ========================== -->

            <form method="POST">

                {% csrf_token %}


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- =========================
                 LOGIN LINK
            ========================== -->

            <div class="login-section">

                <span>
                    Already have an account?
                </span>

                <a href="{% url 'login' %}">
                    Login
                </a>

            </div>


            <!-- =========================
                 FOOTER
            ========================== -->

            <div class="register-footer">

                <p>
                    © 2026 AgriFeed. All rights reserved.
                </p>

            </div>


        </div>

    </div>

</body>

</html>
